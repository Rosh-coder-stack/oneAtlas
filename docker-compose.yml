services:
  postgres:
    image: postgres:16-alpine
    container_name: oneatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-oneatlas}
    ports:
      # Bind strictly to 127.0.0.1 so PostgreSQL is not exposed publicly
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume for persistent database storage
      - oneatlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oneatlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  oneatlas_postgres_data:
    name: oneatlas_postgres_data
